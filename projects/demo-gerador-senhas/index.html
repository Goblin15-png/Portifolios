<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Chaves Criptográficas Blueprint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crypto-unit">
    <div class="unit-header">
      <div>
        <span class="unit-code">MOD-SEC // 02</span>
        <h2>GERADOR DE CHAVES & ENTROPIA</h2>
      </div>
      <span class="crypto-status">CRYPT-GEN 2.0</span>
    </div>

    <!-- Visor da Senha Gerada -->
    <div class="result-box">
      <input type="text" id="passwordOutput" readonly value="G3r4nd0#Ch4v3..." aria-label="Senha Gerada">
      <button id="copyBtn" class="action-btn" title="Copiar Chave">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <div id="copyToast" class="copy-toast">CHAVE COPIADA COM SUCESSO [OK]</div>

    <!-- Medidor de Força e Entropia Técnica -->
    <div class="entropy-meter-box">
      <div class="entropy-header">
        <span class="entropy-label">ENTROPIA / SEGURANÇA</span>
        <span id="entropyScore" class="entropy-value">0 BITS // FRACA</span>
      </div>
      <div class="meter-bar-track">
        <div id="meterBarFill" class="meter-bar-fill"></div>
      </div>
    </div>

    <!-- Controles de Configuração -->
    <div class="controls-panel">
      <!-- Slider de Comprimento -->
      <div class="control-row">
        <div class="control-label">
          <span>COMPRIMENTO</span>
          <span id="lengthVal" class="spec-highlight">16 CARACTERES</span>
        </div>
        <input type="range" id="lengthSlider" min="8" max="64" value="16" class="tech-slider">
      </div>

      <!-- Toggles de Caracteres -->
      <div class="checkbox-grid">
        <label class="tech-checkbox">
          <input type="checkbox" id="includeUpper" checked>
          <span class="box-indicator"></span>
          <span>MAIÚSCULAS [A-Z]</span>
        </label>
        <label class="tech-checkbox">
          <input type="checkbox" id="includeLower" checked>
          <span class="box-indicator"></span>
          <span>MINÚSCULAS [a-z]</span>
        </label>
        <label class="tech-checkbox">
          <input type="checkbox" id="includeNumbers" checked>
          <span class="box-indicator"></span>
          <span>NÚMEROS [0-9]</span>
        </label>
        <label class="tech-checkbox">
          <input type="checkbox" id="includeSymbols" checked>
          <span class="box-indicator"></span>
          <span>SÍMBOLOS [!@#$%]</span>
        </label>
      </div>

      <!-- Botão Gerar -->
      <button id="generateBtn" class="generate-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        GERAR NOVA CHAVE CRIPTOGRÁFICA
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
